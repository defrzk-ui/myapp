name: Deploy myapp

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and restart container
        run: |
          cd ~/myapp
          sudo docker build -t myapp:latest .
          sudo docker stop myapp || true
          sudo docker rm myapp || true
          sudo docker run -d -p 8080:80 --name myapp myapp:latest
